{% extends "base.html" %}
{% block title %}Change Password — Fantasy Playoffs{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="card-title mb-3">Change Password</h4>
        {% if current_user.must_change_pw %}
        <div class="alert alert-info small">You must set a new password before continuing.</div>
        {% endif %}
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" name="new_password" class="form-control" minlength="8" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-dark w-100">Update Password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
